# Activated with --spring.profiles.active=local (optional; run-local.ps1 can also use DEV_LOG_OTP=true).
app:
  auth:
    dev-log-otp: true
  # Live product-form translation without API keys (MyMemory).
  # Hardcoded so a leftover TRANSLATION_PROVIDER=fake in the shell cannot stick.
  # Override with APP_TRANSLATION_PROVIDER=google|deepl|fake|none if needed.
  translation:
    provider: mymemory
