name: Deploy frontend to Vercel

# Push ขึ้น main ที่มีการแก้ใน frontend/ จะ deploy ไป Vercel (production) อัตโนมัติ
# ต้องมี GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Vercel จะ build เองตาม Project Settings (root: frontend, framework: vite, env vars VITE_*)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  # Soft gate: wait for CI workflow conclusion on the same commit before production deploy.
  # Prefer also marking CI jobs as required checks in GitHub branch protection.
  wait-for-ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for CI workflow
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const maxAttempts = 60;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: sha,
                per_page: 5,
              });
              const run = runs.data.workflow_runs[0];
              if (run && run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info(`CI succeeded: ${run.html_url}`);
                  return;
                }
                core.setFailed(`CI finished with ${run.conclusion}: ${run.html_url}`);
                return;
              }
              core.info(`Waiting for CI (attempt ${attempt}/${maxAttempts})...`);
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for CI workflow');

  deploy:
    needs: [wait-for-ci]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}