spring:
  application:
    name: thaishopfun-backend
  # Load backend/.env as properties (works when started from backend/ or the repo root). Real env vars still win.
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/TSF_DB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  auth:
    # Local/dev only: log plaintext OTP at WARN as [DEV-OTP]. Default false; never enable in prod.
    # Set DEV_LOG_OTP=true in backend/.env, or use profile local/dev (application-local.yml / application-dev.yml).
    dev-log-otp: ${DEV_LOG_OTP:false}
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
  features:
    configurator:
      # V42: product configurator (ตัวออกแบบสินค้าเอง) — off until Supitcha wires cart/order (see AB2 handoff note)
      enabled: ${APP_FEATURES_CONFIGURATOR_ENABLED:false}
  merchant:
    storage-root: ${STORAGE_ROOT:./uploads}
    data-encryption-secret: ${DATA_ENCRYPTION_SECRET:thaishopfun-local-data-encryption-secret-change-before-production}
    theme-media:
      max-total-bytes: 209715200
      max-images: 200
      max-videos: 5
      max-fonts: 4
      max-image-bytes: 5242880
      max-video-bytes: 20971520
      max-font-bytes: 1048576
      max-image-dimension: 4000
    collections:
      # V41: shop collections limits
      max-per-shop: 50
      max-products-per-collection: 500
    customer-key-secret: ${CUSTOMER_KEY_SECRET:}
  translation:
    provider: ${TRANSLATION_PROVIDER:none}
    google-api-key: ${GOOGLE_TRANSLATE_API_KEY:}
    deepl-api-key: ${DEEPL_API_KEY:}
    glossary: ${TRANSLATION_GLOSSARY:ThaiShopFun,SKU,mg,ml}
    batch-size: 40
    max-attempts: 5
    retry-backoff-ms: 30000
    poll-delay-ms: 60000
  security:
    jwt-secret: ${JWT_SECRET:thaishopfun-local-development-secret-change-before-production}
    access-token-minutes: 15
    refresh-token-days: 30
    secure-cookies: ${COOKIE_SECURE:false}
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    otp-max-per-hour: 5
    max-login-attempts: 5
    login-lockout-minutes: 15
    password-reset-ttl-minutes: 30
    otp-expose-code: ${OTP_EXPOSE_CODE:true} 
  notification:
    # smtp | log. Blank = smtp when MAIL_HOST is set, otherwise log (only logs, sends nothing).
    email-provider: ${NOTIFICATION_EMAIL_PROVIDER:}
    # log (default, sends nothing). Add real gateways in NotificationConfig#smsSender.
    sms-provider: ${SMS_PROVIDER:log}
    # Base URL used to build the reset-password link in e-mails.
    frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
    reset-password-path: ${APP_RESET_PASSWORD_PATH:/reset-password}
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
      from-name: ${MAIL_FROM_NAME:ThaiShopFun}
      starttls: ${MAIL_STARTTLS:true}
      ssl: ${MAIL_SSL:false}
  shop-team:
    # Single-use invite links (SHA-256 hashed at rest). No email send in local/dev by default —
    # create/resend responses return inviteUrl once for the actor to copy.
    invite-ttl-days: ${SHOP_TEAM_INVITE_TTL_DAYS:7}
    resend-cooldown-seconds: ${SHOP_TEAM_RESEND_COOLDOWN_SECONDS:60}
    invite-create-per-hour: ${SHOP_TEAM_INVITE_CREATE_PER_HOUR:20}
    invite-path: ${SHOP_TEAM_INVITE_PATH:/invite}

# SMTP is configured by app.notification.mail (not spring.mail), so Boot's mail auto-config never
# runs; keep the actuator mail health check off in case actuator is added later.
management:
  health:
    mail:
      enabled: false
