spring:
  application:
    name: thaishopfun-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/TSF_DB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  merchant:
    storage-root: ${STORAGE_ROOT:./uploads}
    data-encryption-secret: ${DATA_ENCRYPTION_SECRET:thaishopfun-local-data-encryption-secret-change-before-production}
  translation:
    provider: ${TRANSLATION_PROVIDER:none}
    google-api-key: ${GOOGLE_TRANSLATE_API_KEY:}
    deepl-api-key: ${DEEPL_API_KEY:}
    glossary: ${TRANSLATION_GLOSSARY:ThaiShopFun,SKU,mg,ml}
    batch-size: 40
    max-attempts: 5
    retry-backoff-ms: 30000
    poll-delay-ms: 60000
  security:
    jwt-secret: ${JWT_SECRET:thaishopfun-local-development-secret-change-before-production}
    access-token-minutes: 15
    refresh-token-days: 30
    secure-cookies: ${COOKIE_SECURE:false}
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
    otp-ttl-minutes: 5
    otp-max-attempts: 5
    otp-resend-cooldown-seconds: 60
    otp-max-per-hour: 5
    max-login-attempts: 5
    login-lockout-minutes: 15
    password-reset-ttl-minutes: 30
    otp-expose-code: ${OTP_EXPOSE_CODE:true} 
  notification:
    # smtp | log. Blank = smtp when MAIL_HOST is set, otherwise log (only logs, sends nothing).
    email-provider: ${NOTIFICATION_EMAIL_PROVIDER:}
    # log (default, sends nothing). Add real gateways in NotificationConfig#smsSender.
    sms-provider: ${SMS_PROVIDER:log}
    # Base URL used to build the reset-password link in e-mails.
    frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
    reset-password-path: ${APP_RESET_PASSWORD_PATH:/reset-password}
    mail:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
      from-name: ${MAIL_FROM_NAME:ThaiShopFun}
      starttls: ${MAIL_STARTTLS:true}
      ssl: ${MAIL_SSL:false}

# SMTP is configured by app.notification.mail (not spring.mail), so Boot's mail auto-config never
# runs; keep the actuator mail health check off in case actuator is added later.
management:
  health:
    mail:
      enabled: false
